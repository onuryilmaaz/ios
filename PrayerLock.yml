# Vakit kilidi (FamilyControls / Ekran Süresi). Apple dağıtım onayı (talep 9XF88FCKUJ) gelene kadar varsayılan
# projeye girmez; geliştirme için:  SALAH_PRAYER_LOCK=YES xcodegen generate
# Gerekli App ID'ler (Family Controls + App Groups): com.onur6541.salah(.dev).PrayerLockMonitor, ...PrayerLockShield.
targets:
  Salah:
    sources:
      - path: PrayerLock/App
      - path: PrayerLock/Shared
    dependencies:
      - target: PrayerLockMonitor
        embed: true
      - target: PrayerLockShield
        embed: true
    entitlements:
      properties:
        com.apple.developer.family-controls: true
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PRAYER_LOCK

  # Vakit girince kilitler, süre dolunca açar.
  PrayerLockMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: PrayerLock/Monitor
      - path: PrayerLock/Shared
    entitlements:
      path: PrayerLock/Monitor/PrayerLockMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.onur6541.salah.shared
    info:
      path: PrayerLock/Monitor/Info.plist
      properties:
        CFBundleDisplayName: Salah Prayer Lock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PrayerLockMonitor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.onur6541.salah.dev.PrayerLockMonitor
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.onur6541.salah.PrayerLockMonitor

  # Kilitli uygulama açılınca görünen ekran.
  PrayerLockShield:
    type: app-extension
    platform: iOS
    sources:
      - path: PrayerLock/Shield
      - path: PrayerLock/Shared
    entitlements:
      path: PrayerLock/Shield/PrayerLockShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.onur6541.salah.shared
    info:
      path: PrayerLock/Shield/Info.plist
      properties:
        CFBundleDisplayName: Salah Prayer Lock Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PrayerLockShield
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.onur6541.salah.dev.PrayerLockShield
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.onur6541.salah.PrayerLockShield
